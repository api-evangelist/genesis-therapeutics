name: Genesis Therapeutics
description: 'Genesis Therapeutics (Genesis Molecular AI) is an AI-focused biotechnology company
  building GEMS (Genesis Exploration of Molecular Space), a generative and predictive AI operating
  system for small-molecule drug discovery. GEMS combines structure-based deep learning, language and
  diffusion models, and physics-based simulation (molecular dynamics and quantum chemistry) to generate
  and optimize molecules for complex targets, accelerating hit identification through lead optimization
  and candidate selection. In 2025 the company introduced Pearl, a next-generation foundation model for
  drug discovery. Headquartered in Burlingame, California with a laboratory in San Diego, Genesis has
  raised over $300M and partners with Eli Lilly, Gilead, Genentech, and Incyte while advancing its own
  therapeutic pipeline. It is not a public API provider: GEMS is a proprietary internal platform with no
  published developer portal, documentation, or API.'
